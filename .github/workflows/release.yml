name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from Cargo.toml, without the v prefix
        required: true
        type: string
      dry_run:
        description: Run every check without publishing crates or creating a release
        required: true
        default: true
        type: boolean

concurrency:
  group: crates-io-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish v${{ inputs.version }}
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Validate release request
        env:
          VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$REF_NAME" == "$DEFAULT_BRANCH" ]] || {
            echo "Releases must run from the default branch ($DEFAULT_BRANCH), not $REF_NAME"
            exit 1
          }
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]] || {
            echo "Invalid semantic version: $VERSION"
            exit 1
          }
          ROOT_VERSION="$(cargo metadata --no-deps --format-version 1 |
            python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(p["version"] for p in data["packages"] if p["name"] == "almostsql"))')"
          MACRO_VERSION="$(cargo metadata --no-deps --format-version 1 |
            python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(p["version"] for p in data["packages"] if p["name"] == "almostsql-macros"))')"
          [[ "$ROOT_VERSION" == "$VERSION" ]] || {
            echo "almostsql is $ROOT_VERSION, expected $VERSION"
            exit 1
          }
          [[ "$MACRO_VERSION" == "$VERSION" ]] || {
            echo "almostsql-macros is $MACRO_VERSION, expected $VERSION"
            exit 1
          }
          git diff --exit-code

      - name: Run release checks
        run: |
          cargo fmt --all --check
          cargo test --workspace --all-targets --all-features
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps
          cargo publish -p almostsql-macros --dry-run

      - name: Create draft GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release create "v$VERSION" --draft --generate-notes --target "$GITHUB_SHA" --title "v$VERSION"

      - name: Publish macro crate
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p almostsql-macros

      - name: Wait for macro crate index propagation
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          for attempt in {1..30}; do
            if cargo search almostsql-macros --limit 1 | grep -F "almostsql-macros = \"$VERSION\""; then
              exit 0
            fi
            echo "Waiting for almostsql-macros $VERSION to reach the crates.io index ($attempt/30)"
            sleep 10
          done
          exit 1

      - name: Publish main crate
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p almostsql --dry-run
          cargo publish -p almostsql

      - name: Publish GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release edit "v$VERSION" --draft=false
