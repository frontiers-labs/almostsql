[package]
name = "almostsql-macros"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Procedural macros for almostsql declarative, type-safe migration schemas"
license = "MIT"
repository = "https://github.com/frontiers-labs/almostsql"
homepage = "https://github.com/frontiers-labs/almostsql"
readme = "README.md"
authors = ["Frontiers Labs"]
keywords = ["sql", "macro", "migrations", "database"]
categories = ["database", "development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.106"
quote = "1.0.45"
syn = "2.0.117"
