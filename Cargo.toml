[workspace]
members = ["almostsql-macros"]
resolver = "3"

[package]
name = "almostsql"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A minimalist async SQL query builder and migration library for SQLite and Postgres"
license = "MIT"
repository = "https://github.com/frontiers-labs/almostsql"
homepage = "https://github.com/frontiers-labs/almostsql"
readme = "README.md"
authors = ["Frontiers Labs"]
keywords = ["sql", "sqlite", "postgres", "query-builder", "migrations"]
categories = ["database"]

[features]
default = ["sqlite"]
sqlite = ["dep:sqlite", "dep:sqlite-vec"]
# Postgres via the synchronous `postgres` driver (no runtime dependency).
postgres = ["dep:postgres"]
# Postgres via `tokio-postgres`; each pooled connection runs on its own
# current-thread Tokio runtime. Takes precedence over `postgres` when both
# features are enabled.
postgres-tokio = ["dep:tokio-postgres", "dep:tokio"]

[dependencies]
almostsql-macros = { version = "0.1.0", path = "almostsql-macros" }
async-channel = "2.5.0"
bytes = "1"
futures = "0.3.32"
postgres = { version = "0.19.12", features = ["with-uuid-1"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
sqlite = { version = "0.37.0", features = ["bundled"], optional = true }
sqlite-vec = { version = "0.1.9", optional = true }
tokio = { version = "1.52.1", default-features = false, features = ["rt", "net", "time"], optional = true }
tokio-postgres = { version = "0.7.18", features = ["with-uuid-1"], optional = true }
uuid = { version = "1.23.1", features = ["v4", "v7"] }

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
criterion = "0.8.2"
tokio = { version = "1.52.1", features = ["macros", "rt"] }

[[bench]]
name = "queries"
harness = false
